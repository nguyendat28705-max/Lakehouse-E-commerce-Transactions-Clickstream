# Spark configuration
spark.master                     spark://spark-master:7077
spark.eventLog.enabled           true
spark.eventLog.dir               hdfs://namenode:8020/spark-logs
spark.history.fs.logDirectory    hdfs://namenode:8020/spark-logs

# Hive Integration
spark.sql.catalogImplementation  hive
spark.sql.hive.metastore.version 2.3.9
spark.sql.hive.metastore.jars    builtin

# HDFS Integration
spark.hadoop.fs.defaultFS        hdfs://namenode:8020

# SQL Settings
spark.sql.warehouse.dir          hdfs://namenode:8020/user/hive/warehouse
spark.serializer                 org.apache.spark.serializer.JavaSerializer
spark.sql.extensions             io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog  org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.delta.logStore.class       org.apache.spark.sql.delta.storage.HDFSLogStore
spark.databricks.delta.schema.autoMerge.enabled true

# Memory and Performance
spark.executor.instances         1
spark.executor.memory            1g
spark.executor.cores             2
spark.driver.memory              1g
spark.cores.max                  2
spark.deploy.defaultCores        2
spark.sql.adaptive.enabled       true
spark.sql.adaptive.coalescePartitions.enabled true

# Thrift Server Settings
spark.sql.hive.thriftServer.singleSession true
